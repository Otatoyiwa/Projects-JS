
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted textarea</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="typing">
        <input type="text" placeholder="Start Typing..." maxlength="250">
        <div class="num_holder">
            <p id="main"><span class="count">0</span>/250</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
