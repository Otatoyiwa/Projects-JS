<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "Page">

        <div class="tabs">
            <button type="button" class="tab" data-tab="but-1">First Tab</button>
            <button type="button" class="tab" data-tab="but-2">Second Tab</button>
            <button type="button" class="tab" data-tab="but-3">Third Tab</button>
            <button type="button" class="tab" data-tab="but-4">Fourth Tab</button>
        </div>
        <div class="info">
            <section class="tabs_card" id="but-1">
               <p> First Tab is active</p>
            </section>
            <section class="tabs_card" id="but-2">
                <p> Second Tab is active</p>
            </section>
            <section class="tabs_card" id="but-3">
                <p>Third Tab is active</p>
            </section>
            <section class="tabs_card" id="but-4">
               <p> Fourth Tab is active</p>
            </section>
            
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
